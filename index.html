<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash Cards</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./assets/vendor/normalize.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./assets/js/index.js"></script>
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a href="#home" class="nav__link">My decks</a></li>
        </ul>
      </nav>
    </header>

    <main class="page__main-content">
      <section id="home" class="gallery">
        <h2 class="gallery__title">My Decks</h2>
        <div class="wrapping-row">
          <ul class="gallery__list wrapping-row__display-contents"></ul>
          <button type="button" class="gallery__new-card-btn">
            + New Deck
          </button>
        </div>
      </section>

      <section id="deck-view" class="gallery">
        <div class="gallery__header">
          <h2 class="gallery__title"></h2>
          <button type="button" class="gallery__practice-btn">Practice</button>
        </div>
        <div class="wrapping-row">
          <ul class="gallery__list wrapping-row__display-contents"></ul>
          <button
            type="button"
            class="gallery__new-card-btn gallery__new-card-btn_location_deck-view"
          >
            + New Card
          </button>
        </div>
      </section>

      <section id="carousel" class="carousel">
        <h2 class="carousel__title"></h2>
        <div class="carousel__grid">
          <button
            type="button"
            aria-label="Go to previous card"
            class="carousel__btn carousel__btn_type_left"
          ></button>
          <div class="carousel__card">
            <p class="carousel__text"></p>
          </div>
          <button
            type="button"
            aria-label="Flip card"
            class="carousel__btn carousel__btn_type_flip"
          ></button>
          <button
            type="button"
            aria-label="Go to next card"
            class="carousel__btn carousel__btn_type_right"
          ></button>
        </div>
      </section>

      <section id="not-found" class="not-found">
        <h2 class="not-found__status-code">404</h2>
        <p class="not-found__text">Sorry, nothing found!</p>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">Jan Valdez Flash Cards</p>
    </footer>

    <template id="deck-template">
      <li class="card card_type_deck">
        <a href="#" class="card__link"></a>
        <h3 class="card__title"></h3>
        <div class="card__row">
          <p class="card__count"></p>
          <button
            type="button"
            aria-label="Delete deck"
            class="card__action-btn card__action-btn_type_delete"
          ></button>
        </div>
      </li>
    </template>

    <template id="flashcard-template">
      <li class="card card_type_flashcard">
        <h3 class="card__title"></h3>
        <div class="card__row">
          <button
            type="button"
            aria-label="Flip card to show answer"
            class="card__action-btn card__action-btn_type_flip"
          ></button>
          <button
            type="button"
            aria-label="Delete card"
            class="card__action-btn card__action-btn_type_delete"
          ></button>
        </div>
      </li>
    </template>

    <div id="confirmation-modal" class="modal">
      <div class="modal__container">
        <p class="modal__text">Are you sure you want to delete this?</p>
        <div class="modal__buttons">
          <button type="button" class="modal__btn modal__btn_type_cancel">
            Cancel
          </button>
          <button type="button" class="modal__btn modal__btn_type_confirm">
            Delete
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
